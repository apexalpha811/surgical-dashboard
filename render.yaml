services:
  - type: web
    name: culver-city-surgical-dashboard-docupipe
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: APP_MODE
        value: live
      - key: DOCUPIPE_BASE_URL
        value: https://app.docupipe.ai
      - key: STEDI_HEALTHCARE_BASE_URL
        value: https://healthcare.us.stedi.com/2024-04-01
      - key: STEDI_CLAIMS_BASE_URL
        value: https://claims.us.stedi.com/2025-03-07
      - key: STEDI_ENROLLMENTS_BASE_URL
        value: https://enrollments.us.stedi.com/2024-09-01
      - key: STEDI_PAYERS_BASE_URL
        value: https://payers.us.stedi.com/2024-04-01
      - key: DOCUPIPE_API_KEY
        sync: false
      - key: STEDI_API_KEY
        sync: false
